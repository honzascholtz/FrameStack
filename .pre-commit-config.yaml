repos:
-   repo: local
    hooks:
    -   id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        # We disable (C)onvention and (R)efactor warnings by default so it 
        # doesn't block commits on minor style issues in existing code.
        # You can remove this argument later if you want strict linting.
        args: ["--disable=C,R"]